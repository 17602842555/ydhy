name: Deploy backend to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'wrangler.jsonc'
      - 'scripts/prepare-cloudflare-config.mjs'
      - 'scripts/export-d1-seed.mjs'
      - '.github/workflows/cloudflare-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.YYHY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '7190a44a232375258035081a03cc84bf' }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID || '345ac340-35da-48ca-a75e-ab8a471865dc' }}
      HUAGE_CORS_ORIGIN: ${{ vars.HUAGE_CORS_ORIGIN || 'https://17602842555.github.io,http://127.0.0.1:5173' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate D1 seed
        run: npm run cf:seed:generate

      - name: Prepare Wrangler config
        run: node scripts/prepare-cloudflare-config.mjs

      - name: Normalize Cloudflare token
        run: |
          CLEAN_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n\t ')"
          CLEAN_TOKEN="${CLEAN_TOKEN#Bearer}"
          CLEAN_TOKEN="${CLEAN_TOKEN#bearer}"
          CLEAN_TOKEN="${CLEAN_TOKEN#CLOUDFLARE_API_TOKEN=}"
          CLEAN_TOKEN="${CLEAN_TOKEN#YYHY=}"
          CLEAN_TOKEN="${CLEAN_TOKEN#\"}"
          CLEAN_TOKEN="${CLEAN_TOKEN%\"}"
          CLEAN_TOKEN="${CLEAN_TOKEN#\'}"
          CLEAN_TOKEN="${CLEAN_TOKEN%\'}"
          echo "::add-mask::$CLEAN_TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$CLEAN_TOKEN" >> "$GITHUB_ENV"

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote

      - name: Verify D1 state store
        run: npx wrangler d1 execute DB --remote --command "select count(*) as count from app_state;"

      - name: Deploy Worker
        run: npx wrangler deploy
